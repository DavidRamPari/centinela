# Security headers for the dashboard's HTML and static files (session S6). Included in every
# location that serves files from the build; /api/ responses carry the API's own headers.
# Same values as packages/web/security/headers.ts (test/csp.test.ts compares them). nginx
# drops inherited add_header directives in a location that sets its own, so each location
# includes this file instead of relying on the server block.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
