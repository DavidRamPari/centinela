title: SSH brute force from a single source
id: 6c1f0b6e-5f5a-4e61-9a0e-1f2b3c4d5e6f
name: centinela-ssh-bruteforce
status: experimental
description: Ten or more failed SSH logins from one source IP against one host within five minutes.
references:
    - https://attack.mitre.org/techniques/T1110/001/
author: DavidRamPari
date: 2026-10-26
correlation:
    type: event_count
    rules:
        - centinela-ssh-auth-failure
    group-by:
        - source.ip
        - host.name
    timespan: 5m
    condition:
        gte: 10
    generate: false
level: high
tags:
    - attack.credential-access
    - attack.t1110.001
falsepositives:
    - Automation retrying with an expired password
    - A misconfigured client looping over several keys
