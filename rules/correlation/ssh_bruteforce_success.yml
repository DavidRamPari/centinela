title: Successful SSH login after a brute force
id: 1751f556-a4e2-493f-a475-ead6e0163909
name: centinela-ssh-bruteforce-success
status: experimental
description: A source IP that triggered the SSH brute-force correlation logs in successfully within thirty minutes. The account is likely compromised. Chains on centinela-ssh-bruteforce, so a staff member who mistypes a password and then logs in never fires it.
references:
    - https://attack.mitre.org/techniques/T1110/001/
    - https://attack.mitre.org/techniques/T1078/
author: DavidRamPari
date: 2026-10-26
correlation:
    type: temporal_ordered
    rules:
        - centinela-ssh-bruteforce
        - centinela-ssh-auth-success
    group-by:
        - source.ip
    timespan: 30m
    generate: false
level: critical
tags:
    - attack.credential-access
    - attack.initial-access
    - attack.t1110.001
    - attack.t1078
falsepositives:
    - A user who locked themselves out with an old password and then remembered the right one
