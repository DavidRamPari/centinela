title: Web scanning burst from a single source
id: 63558a21-d346-4bf6-9f99-5ea7bc5fb1b8
name: centinela-web-scanning-burst
status: experimental
description: Fifty or more requests answered 404 for one source IP on one web server within two minutes, the signature of content discovery tools such as gobuster or Nikto.
references:
    - https://attack.mitre.org/techniques/T1595/002/
author: DavidRamPari
date: 2026-10-26
correlation:
    type: event_count
    rules:
        - centinela-web-not-found
    group-by:
        - source.ip
        - host.name
    timespan: 2m
    condition:
        gte: 50
    generate: false
level: medium
tags:
    - attack.reconnaissance
    - attack.t1595.002
falsepositives:
    - Internal vulnerability scanners
    - A broken deployment that makes every asset of a page return 404
