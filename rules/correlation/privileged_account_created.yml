title: New account added to a privileged group
id: 5433ea22-e63b-4e9f-8543-10d546176f23
name: centinela-privileged-account-created
status: experimental
description: A local account is created and then added to a privileged group (sudo, wheel, adm or root) on the same host within ten minutes, a common persistence step after a compromise.
references:
    - https://attack.mitre.org/techniques/T1136/001/
    - https://attack.mitre.org/techniques/T1098/
author: DavidRamPari
date: 2026-10-26
correlation:
    type: temporal_ordered
    rules:
        - centinela-user-created
        - centinela-user-added-to-privileged-group
    group-by:
        - user.name
        - host.name
    timespan: 10m
    generate: true
level: high
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1136.001
    - attack.t1098
falsepositives:
    - Administrators provisioning a new administrator account
