title: SSH password spraying from a single source
id: 51acc743-fd6b-4807-b520-903760961efb
name: centinela-ssh-password-spraying
status: experimental
description: Failed SSH logins for ten or more distinct user names from one source IP within ten minutes, typically a few attempts per account to stay below lockout and brute-force thresholds.
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: DavidRamPari
date: 2026-10-26
correlation:
    type: value_count
    rules:
        - centinela-ssh-auth-failure
    group-by:
        - source.ip
    timespan: 10m
    condition:
        gte: 10
        field: user.name
    generate: false
level: high
tags:
    - attack.credential-access
    - attack.t1110.003
falsepositives:
    - A jump host or NAT gateway shared by many users who mistype their passwords
