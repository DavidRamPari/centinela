title: File written by a Windows download utility
id: e47acabd-e3aa-4924-9bf4-c2ef2f1f5850
name: centinela-win-lolbin-file-drop
status: experimental
description: certutil, bitsadmin, mshta or regsvr32 created a file outside their own caches. Administrators seldom download files this way; attackers use these signed binaries to drop payloads while avoiding browser and proxy controls.
references:
    - https://attack.mitre.org/techniques/T1105/
author: DavidRamPari
date: 2026-10-26
tags:
    - attack.command-and-control
    - attack.t1105
logsource:
    product: windows
    category: file_event
detection:
    selection:
        Image|endswith:
            - '\certutil.exe'
            - '\bitsadmin.exe'
            - '\mshta.exe'
            - '\regsvr32.exe'
    filter_caches:
        TargetFilename|contains:
            - '\CryptnetUrlCache\'
            - '\INetCache\'
    condition: selection and not filter_caches
falsepositives:
    - Administrators decoding or exporting certificates with certutil
level: medium
