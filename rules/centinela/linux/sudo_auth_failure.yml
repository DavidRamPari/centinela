title: Sudo authentication failure
id: d82f46bc-faa1-4ac6-812b-624423374741
name: centinela-sudo-auth-failure
status: experimental
description: A user failed to authenticate to sudo (wrong password). Repeated failures can indicate an attacker trying to escalate privileges with a compromised account.
references:
    - https://attack.mitre.org/techniques/T1548/003/
author: DavidRamPari
date: 2026-10-26
tags:
    - attack.privilege-escalation
    - attack.defense-evasion
    - attack.t1548.003
logsource:
    product: linux
    service: sudo
detection:
    selection:
        event.action: sudo_auth_failure
    condition: selection
falsepositives:
    - Administrators mistyping their password
level: low
