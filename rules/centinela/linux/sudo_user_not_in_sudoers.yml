title: Sudo attempt by a user not in sudoers
id: b7b1255e-2d9d-4c62-ae0f-b373fd8a9212
name: centinela-sudo-user-not-in-sudoers
status: experimental
description: A user who is not allowed to use sudo tried to run a command through it. Legitimate users rarely do this; an attacker on a low-privileged account often does.
references:
    - https://attack.mitre.org/techniques/T1548/003/
author: DavidRamPari
date: 2026-10-26
tags:
    - attack.privilege-escalation
    - attack.defense-evasion
    - attack.t1548.003
logsource:
    product: linux
    service: sudo
detection:
    selection:
        event.action: sudo_not_in_sudoers
    condition: selection
falsepositives:
    - New staff who have not been granted sudo yet
level: medium
