title: SSH authentication success
id: 5a38afe9-6011-4196-adb3-a12029a56d4b
name: centinela-ssh-auth-success
status: experimental
description: A successful SSH login. Building block for the brute-force-then-success correlation; it does not alert on its own.
references:
    - https://attack.mitre.org/techniques/T1078/
author: DavidRamPari
date: 2026-10-26
tags:
    - attack.initial-access
    - attack.t1078
logsource:
    product: linux
    service: sshd
detection:
    selection:
        event.action: ssh_login
        event.outcome: success
    condition: selection
falsepositives:
    - Every legitimate SSH login
level: informational
