title: User added to a privileged group
id: 00628cb9-34ac-4c3e-9bf0-decb6f84701f
name: centinela-user-added-to-privileged-group
status: experimental
description: A user was added to a group that grants administrative rights (sudo, wheel, adm or root).
references:
    - https://attack.mitre.org/techniques/T1098/
author: DavidRamPari
date: 2026-10-26
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: linux
    service: auth
detection:
    selection:
        event.action: user_added_to_group
        group.name:
            - sudo
            - wheel
            - adm
            - root
    condition: selection
falsepositives:
    - Administrators granting rights to new staff
level: medium
