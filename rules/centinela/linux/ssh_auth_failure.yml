title: SSH authentication failure
id: 5ab518e4-b4bf-44a2-9874-a8e86a590287
name: centinela-ssh-auth-failure
status: experimental
description: A failed SSH login (wrong password, rejected key or invalid user). Building block for the brute-force and password-spraying correlations; it does not alert on its own.
references:
    - https://attack.mitre.org/techniques/T1110/
author: DavidRamPari
date: 2026-10-26
tags:
    - attack.credential-access
    - attack.t1110
logsource:
    product: linux
    service: sshd
detection:
    selection:
        event.action: ssh_login
        event.outcome: failure
    condition: selection
falsepositives:
    - Users mistyping their password
    - Automation retrying with an expired password or a revoked key
level: low
